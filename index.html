<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confere & Paga Oficial</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f7; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { max-width: 480px; margin: 0 auto; background: #fff; min-height: 100vh; width: 100%; box-shadow: 0 0 40px rgba(0,0,0,0.08); padding: 40px 24px; }
        .logo-wrapper { text-align: center; margin-bottom: 32px; }
        .logo { width: 100px; height: 100px; border-radius: 50%; box-shadow: 0 4px 16px rgba(0,0,0,0.1); margin-bottom: 16px; }
        .brand-name { font-size: 24px; font-weight: 800; color: #1a1a1a; }
        .brand-tag { font-size: 13px; color: #ff6b00; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }
        .section-title { font-size: 16px; font-weight: 700; color: #1a1a1a; margin: 24px 0 16px; text-align: center; }
        .link-card { display: block; background: #fff; border: 2px solid #f0f0f0; border-radius: 12px; padding: 16px 20px; margin-bottom: 12px; text-decoration: none; transition: all 0.2s; }
        .link-card:hover { border-color: #ff6b00; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(255,107,0,0.15); }
        .link-card-title { font-size: 15px; font-weight: 700; color: #1a1a1a; }
        .link-card-sub { font-size: 12px; color: #999; margin-top: 2px; }
        .footer { text-align: center; margin-top: 40px; padding-top: 24px; border-top: 1px solid #f0f0f0; }
        .footer-brand { font-size: 13px; font-weight: 700; color: #1a1a1a; }
        .footer-copy { font-size: 11px; color: #ccc; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-wrapper">
            <img src="logo.jpg" alt="Confere & Paga" class="logo">
            <div class="brand-name">Confere & Paga</div>
            <div class="brand-tag">Oficial</div>
        </div>
        <div class="section-title">Nossos Produtos</div>
        <a href="tenis" class="link-card">
            <div class="link-card-title">👟 Tênis Meia</div>
            <div class="link-card-sub">Ver oferta</div>
        </a>
        <a href="kit-blusas" class="link-card">
            <div class="link-card-title">👕 Kit 3 Blusas Regata</div>
            <div class="link-card-sub">Ver oferta</div>
        </a>
        <a href="creme-ganache" class="link-card">
            <div class="link-card-title">🍫 Creme Ganache 1kg</div>
            <div class="link-card-sub">Ver oferta</div>
        </a>
        <div class="footer">
            <div class="footer-brand">Confere & Paga Oficial</div>
            <div class="footer-copy">© 2026 Todos os direitos reservados</div>
        </div>
    </div>
</body>
</html>
